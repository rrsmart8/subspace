[project]
name = "alpaca-market-mcp"
version = "0.1.0"
description = "Read-only Alpaca market-data MCP server (stdio) for the Subspace Tier 3 assistant."
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.1.4",
    "alpaca-py==0.44.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
